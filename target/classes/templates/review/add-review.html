<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments :: head('Add Review')"></head>
<body>
<div th:replace="fragments :: navbar"></div>
<div th:replace="fragments :: alerts"></div>
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="cr-card p-4">
                <h1 class="mb-1" style="font-size:1.5rem;font-weight:800;"><i class="bi bi-pencil me-2" style="color:var(--cr-gold);"></i>Write a Review</h1>
                <p class="text-muted mb-4" th:text="'Reviewing: ' + ${movie.title}">Reviewing a movie</p>
                <form th:action="@{/reviews/add/{id}(id=${movie.id})}" method="post">
                    <input type="hidden" name="movieId" th:value="${movie.id}">
                    <div class="mb-3">
                        <label class="form-label">Rating (1–5)</label>
                        <div class="d-flex gap-2 mb-2">
                            <span th:each="i : ${#numbers.sequence(1,5)}"
                                  style="cursor:pointer;font-size:1.5rem;color:var(--cr-border);"
                                  class="star-btn"
                                  th:attr="data-val=${i}">&#9733;</span>
                        </div>
                        <input type="number" class="form-control" name="rating" id="ratingInput" min="1" max="5" required placeholder="1–5">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Your Review</label>
                    <textarea class="form-control" name="comment" rows="5" required placeholder="Share your thoughts about this movie..."></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-cr-gold px-4"><i class="bi bi-check-lg me-1"></i>Submit Review</button>
                        <a class="btn btn-cr-outline" th:href="@{/movies/{id}(id=${movie.id})}">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<div th:replace="fragments :: footer"></div>
<div th:replace="fragments :: scripts"></div>
<script>
    const stars = document.querySelectorAll('.star-btn');
    const input = document.getElementById('ratingInput');
    stars.forEach(s => {
        s.addEventListener('click', () => {
            const val = parseInt(s.getAttribute('data-val'));
            input.value = val;
            stars.forEach((star, idx) => {
                star.style.color = idx < val ? 'var(--cr-gold)' : 'var(--cr-border)';
            });
        });
        s.addEventListener('mouseover', () => {
            const val = parseInt(s.getAttribute('data-val'));
            stars.forEach((star, idx) => {
                star.style.color = idx < val ? 'var(--cr-gold)' : 'var(--cr-border)';
            });
        });
        s.addEventListener('mouseout', () => {
            const val = parseInt(input.value) || 0;
            stars.forEach((star, idx) => {
                star.style.color = idx < val ? 'var(--cr-gold)' : 'var(--cr-border)';
            });
        });
    });
</script>
</body>
</html>
