<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments :: head('Users')"></head>
<body>
<div th:replace="fragments :: navbar"></div>
<div th:replace="fragments :: alerts"></div>
<div class="container py-4">
    <div class="page-header"><h1>All Users</h1></div>
    <div class="cr-card p-0" style="overflow:hidden;">
        <table class="cr-table">
            <thead><tr><th>ID</th><th>User</th><th>Email</th><th>Role</th><th>Status</th></tr></thead>
            <tbody>
            <tr th:each="userItem : ${users}">
                <td th:text="${userItem.id}">1</td>
                <td>
                    <div class="d-flex align-items-center gap-2">
                        <div class="avatar" th:if="${userItem.imagePath != null and !userItem.imagePath.isBlank()}">
                            <img class="avatar-image" th:src="${userItem.imagePath}" th:alt="${userItem.fullName}">
                        </div>
                        <div class="avatar avatar-initial" th:if="${userItem.imagePath == null or userItem.imagePath.isBlank()}"
                             th:text="${#strings.toUpperCase(#strings.substring(userItem.username,0,1))}">U</div>
                        <div>
                            <div style="font-weight:700;" th:text="${userItem.fullName}">Name</div>
                            <div class="text-muted" style="font-size:.82rem;">@<span th:text="${userItem.username}">username</span></div>
                        </div>
                    </div>
                </td>
                <td th:text="${userItem.email}">email</td>
                <td th:text="${userItem.role}">USER</td>
                <td><span class="badge-active" th:if="${userItem.active}">Active</span><span class="badge-returned" th:if="${!userItem.active}">Inactive</span></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<div th:replace="fragments :: footer"></div>
<div th:replace="fragments :: scripts"></div>
</body>
</html>
