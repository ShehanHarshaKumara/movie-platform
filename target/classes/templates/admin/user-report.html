<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments :: head('User Report')"></head>
<body>
<div th:replace="fragments :: navbar"></div>
<div th:replace="fragments :: alerts"></div>
<div class="container py-4">
    <a href="/admin/reports" class="btn btn-cr-outline btn-sm mb-4"><i class="bi bi-arrow-left me-1"></i>Back to Reports</a>

    <div th:if="${userReport != null and !userReport.isEmpty()}">
        <div class="cr-card p-4 mb-4">
            <div class="d-flex align-items-center gap-3 mb-3">
                <div style="width:56px;height:56px;border-radius:50%;background:var(--cr-accent);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;color:#fff;"
                     th:text="${#strings.toUpperCase(#strings.substring(userReport['user'].username,0,1))}">U</div>
                <div>
                    <h1 style="font-size:1.5rem;font-weight:800;margin:0;" th:text="${userReport['user'].fullName}">Name</h1>
                    <p class="text-muted mb-0" style="font-size:.875rem;" th:text="${'@' + userReport['user'].username + ' · ' + userReport['user'].email}">info</p>
                </div>
            </div>
            <span style="background:rgba(79,195,247,.1);color:var(--cr-info);border:1px solid rgba(79,195,247,.25);border-radius:999px;padding:.25em .75em;font-size:.8rem;font-weight:600;" th:text="${userReport['user'].role}">USER</span>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-value" th:text="${userReport['totalRentals']}">0</div><div class="stat-label">Total Rentals</div></div></div>
            <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-value" th:text="${userReport['activeRentals']}">0</div><div class="stat-label">Active Rentals</div></div></div>
            <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-value" style="color:var(--cr-success);">$<span th:text="${#numbers.formatDecimal(userReport['totalSpent'],1,2)}">0.00</span></div><div class="stat-label">Total Spent</div></div></div>
            <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-value" th:text="${userReport['totalReviews']}">0</div><div class="stat-label">Reviews</div></div></div>
        </div>

        <div class="cr-card p-4">
            <h2 style="font-size:1rem;font-weight:700;margin-bottom:1rem;"><i class="bi bi-clock-history me-2" style="color:var(--cr-info);"></i>Recently Watched</h2>
            <div class="d-flex flex-column gap-2">
                <div class="d-flex align-items-center gap-2 p-2" style="background:var(--cr-surface);border-radius:6px;" th:each="movie : ${userReport['recentlyWatched']}">
                    <i class="bi bi-film" style="color:var(--cr-muted);"></i>
                    <span th:text="${movie.title}" style="font-size:.875rem;">Movie</span>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${userReport == null or userReport.isEmpty()}" class="alert cr-alert-warning p-4">
        <i class="bi bi-exclamation-triangle me-2"></i>User report not found.
    </div>
</div>
<div th:replace="fragments :: footer"></div>
<div th:replace="fragments :: scripts"></div>
</body>
</html>
