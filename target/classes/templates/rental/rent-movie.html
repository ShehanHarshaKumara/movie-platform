<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments :: head('Rent Movie')"></head>
<body>
<div th:replace="fragments :: navbar"></div>
<div th:replace="fragments :: alerts"></div>
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="cr-card p-4">
                <h1 class="mb-1" style="font-size:1.5rem;font-weight:800;"><i class="bi bi-bag-plus me-2" style="color:var(--cr-success);"></i>Rent Movie</h1>
                <p class="text-muted mb-4">Choose your rental duration, then continue to payment.</p>
                <form th:action="@{/rentals/rent/{id}(id=${movie.id})}" method="post">
                    <input type="hidden" name="movieId" th:value="${movie.id}">
                    <div class="cr-card p-3 mb-4">
                        <div class="d-flex justify-content-between mb-2"><span class="text-muted">Movie</span><strong th:text="${movie.title}">Title</strong></div>
                        <div class="d-flex justify-content-between mb-2"><span class="text-muted">Genre</span><span th:text="${movie.genre}">Genre</span></div>
                        <div class="d-flex justify-content-between mb-2"><span class="text-muted">Director</span><span th:text="${movie.director}">Director</span></div>
                        <div class="d-flex justify-content-between"><span class="text-muted">Price per day</span><strong style="color:var(--cr-success);">$<span th:text="${#numbers.formatDecimal(movie.rentalPrice,1,2)}">0.00</span></strong></div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Rental Duration (days)</label>
                        <input class="form-control" type="number" name="days" th:value="${defaultDays}" min="1" max="30" required>
                        <div class="text-muted mt-2" style="font-size:.85rem;">
                            Estimated total: <strong style="color:var(--cr-gold);">$<span th:text="${#numbers.formatDecimal(estimatedFee,1,2)}">0.00</span></strong>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-cr-success px-4"><i class="bi bi-credit-card me-1"></i>Continue to Payment</button>
                        <a class="btn btn-cr-outline" th:href="@{/movies/{id}(id=${movie.id})}">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<div th:replace="fragments :: footer"></div>
<div th:replace="fragments :: scripts"></div>
</body>
</html>
