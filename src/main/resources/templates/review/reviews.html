<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments :: head('My Reviews')"></head>
<body>
<div th:replace="fragments :: navbar"></div>
<div th:replace="fragments :: alerts"></div>
<div class="container py-4">
    <div class="page-header"><h1>My Reviews</h1><p>All reviews you have written.</p></div>

    <div th:if="${reviews == null or reviews.isEmpty()}" class="alert cr-alert-info p-4 text-center">
        <i class="bi bi-chat-square fs-2 d-block mb-2"></i>You haven't written any reviews yet.
        <a href="/movies" class="btn btn-cr-primary btn-sm mt-2">Browse Movies</a>
    </div>

    <div class="d-flex flex-column gap-3">
        <div class="review-card" th:each="review : ${reviews}">
            <div class="d-flex justify-content-between align-items-start mb-2">
                <div>
                    <div style="font-weight:700;font-size:.95rem;" th:text="${review.movieTitle}">Movie</div>
                    <div class="text-muted" style="font-size:.78rem;" th:text="${review.reviewDate}">Date</div>
                </div>
                <div style="background:rgba(245,197,24,.15);border:1px solid rgba(245,197,24,.3);border-radius:8px;padding:.3rem .75rem;font-weight:700;color:var(--cr-gold);font-size:.9rem;">
                    <i class="bi bi-star-fill me-1" style="font-size:.75rem;"></i><span th:text="${review.rating}">5</span>/5
                </div>
            </div>
            <p style="color:var(--cr-text);font-size:.875rem;line-height:1.6;margin-bottom:.75rem;" th:text="${review.comment}">Comment</p>
            <div class="d-flex gap-2">
                <a class="btn btn-cr-gold btn-sm" th:href="@{/reviews/edit/{id}(id=${review.id})}"><i class="bi bi-pencil me-1"></i>Edit</a>
                <form th:action="@{/reviews/delete/{id}(id=${review.id})}" method="post">
                    <button class="btn btn-cr-danger btn-sm" type="submit">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>
<div th:replace="fragments :: footer"></div>
<div th:replace="fragments :: scripts"></div>
</body>
</html>
