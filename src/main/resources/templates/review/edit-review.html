<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments :: head('Edit Review')"></head>
<body>
<div th:replace="fragments :: navbar"></div>
<div th:replace="fragments :: alerts"></div>
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="cr-card p-4">
                <h1 class="mb-1" style="font-size:1.5rem;font-weight:800;"><i class="bi bi-pencil-square me-2" style="color:var(--cr-gold);"></i>Edit Review</h1>
                <p class="text-muted mb-4">Update your review below.</p>
                <form th:action="@{/reviews/edit/{id}(id=${review.id})}" method="post" th:object="${review}">
                    <div class="mb-3">
                        <label class="form-label">Rating (1–5)</label>
                        <input type="number" class="form-control" th:field="*{rating}" min="1" max="5" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Your Review</label>
                        <textarea class="form-control" th:field="*{comment}" rows="5" required></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-cr-gold px-4"><i class="bi bi-check-lg me-1"></i>Update Review</button>
                        <a class="btn btn-cr-outline" href="/reviews/my">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<div th:replace="fragments :: footer"></div>
<div th:replace="fragments :: scripts"></div>
</body>
</html>
