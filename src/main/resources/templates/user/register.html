<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments :: head('Create Account')"></head>
<body style="background:var(--cr-bg);">
<div th:replace="fragments :: navbar"></div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="text-center mb-4">
                <div style="width:64px;height:64px;border-radius:16px;background:var(--cr-accent);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;">
                    <i class="bi bi-person-plus text-white fs-3"></i>
                </div>
                <h1 style="font-size:1.6rem;font-weight:800;">Create an Account</h1>
                <p class="text-muted">Join CineRent - it's free</p>
            </div>

            <div class="cr-card p-4">
                <div th:if="${error}" class="alert cr-alert-danger d-flex gap-2 align-items-center p-3 mb-3">
                    <i class="bi bi-exclamation-circle-fill"></i><span th:text="${error}">Error</span>
                </div>

                <form action="/users/register" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" name="username" th:value="${user?.username}" required placeholder="johndoe">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                                <input type="text" class="form-control" name="fullName" th:value="${user?.fullName}" required placeholder="John Doe">
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" name="email" th:value="${user?.email}" required placeholder="john@example.com">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" name="password" required placeholder="********">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="form-control" name="confirmPassword" required placeholder="********">
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-3">
                        <button type="submit" class="btn btn-cr-primary py-2">
                            <i class="bi bi-person-check me-1"></i>Create Account
                        </button>
                        <a href="/users/login" class="btn btn-cr-outline">
                            <i class="bi bi-arrow-left me-1"></i>Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<div th:replace="fragments :: scripts"></div>
</body>
</html>
