<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments :: head('Sign In')"></head>
<body style="background:var(--cr-bg);">
<div th:replace="fragments :: navbar"></div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-4 col-md-6">
            <div class="text-center mb-4">
                <div style="width:64px;height:64px;border-radius:16px;background:var(--cr-accent);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;">
                    <i class="bi bi-film text-white fs-3"></i>
                </div>
                <h1 style="font-size:1.6rem;font-weight:800;">Welcome back</h1>
                <p class="text-muted">Sign in to your CineRent account</p>
            </div>

            <div class="cr-card p-4">
                <div th:if="${param.registered}" class="alert cr-alert-success d-flex gap-2 align-items-center p-3 mb-3">
                    <i class="bi bi-check-circle-fill"></i>Registration successful! Please log in.
                </div>
                <div th:if="${success}" class="alert cr-alert-success d-flex gap-2 align-items-center p-3 mb-3">
                    <i class="bi bi-check-circle-fill"></i><span th:text="${success}">Success</span>
                </div>
                <div th:if="${error}" class="alert cr-alert-danger d-flex gap-2 align-items-center p-3 mb-3">
                    <i class="bi bi-exclamation-circle-fill"></i><span th:text="${error}">Error</span>
                </div>

                <form action="/users/login" method="post" autocomplete="off">
                    <input type="text" name="loginShadowUser" class="d-none" tabindex="-1" aria-hidden="true" autocomplete="username">
                    <input type="password" name="loginShadowPass" class="d-none" tabindex="-1" aria-hidden="true" autocomplete="current-password">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" name="username" required autofocus placeholder="your username" autocomplete="off" autocapitalize="none" spellcheck="false" readonly onfocus="this.removeAttribute('readonly');">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" name="password" required placeholder="********" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-cr-primary w-100 py-2">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
                    </button>
                </form>

                <hr class="my-3">

                <div style="background:rgba(229,9,20,.08);border:1px solid rgba(229,9,20,.2);border-radius:8px;padding:.75rem 1rem;">
                    <div style="font-size:.8rem;font-weight:600;color:var(--cr-muted);margin-bottom:.4rem;">ADMINISTRATOR ACCESS</div>
                    <a href="/admin/login" class="btn btn-cr-outline btn-sm w-100">
                        <i class="bi bi-shield-lock me-1"></i>Admin Login
                    </a>
                </div>
            </div>

            <p class="text-center mt-3 text-muted" style="font-size:.875rem;">
                Don't have an account? <a href="/users/register">Register here</a>
            </p>
        </div>
    </div>
</div>
<div th:replace="fragments :: scripts"></div>
</body>
</html>
