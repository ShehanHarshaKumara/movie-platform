<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments :: head('Recently Watched')"></head>
<body>
<div th:replace="fragments :: navbar"></div>
<div th:replace="fragments :: alerts"></div>
<div class="container py-4">
    <div class="page-header"><h1>Recently Watched</h1><p>Your most recently rented movies.</p></div>

    <div th:if="${latestMovie == null}" class="alert cr-alert-info p-4 text-center">
        <i class="bi bi-play-circle fs-2 d-block mb-2"></i>Nothing recently watched.
    </div>

    <div class="cr-card p-4" th:if="${latestMovie != null}">
        <div class="d-flex align-items-center gap-3">
            <div style="width:48px;height:48px;border-radius:10px;background:var(--cr-surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <i class="bi bi-play-circle" style="color:var(--cr-accent);font-size:1.5rem;"></i>
            </div>
            <div class="flex-grow-1">
                <div style="font-weight:600;font-size:1.05rem;" th:text="${latestMovie.title}">Movie Title</div>
                <div class="text-muted" style="font-size:.8rem;"><span th:text="${latestMovie.director}">Director</span> • <span th:text="${latestMovie.genre}">Genre</span></div>
            </div>
            <a class="btn btn-cr-primary btn-sm" th:href="@{/movies/{id}(id=${latestMovie.id})}">Open Movie</a>
        </div>
    </div>
</div>
<div th:replace="fragments :: footer"></div>
<div th:replace="fragments :: scripts"></div>
</body>
</html>
