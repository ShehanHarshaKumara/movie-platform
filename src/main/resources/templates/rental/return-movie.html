<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments :: head('Return Movie')"></head>
<body>
<div th:replace="fragments :: navbar"></div>
<div th:replace="fragments :: alerts"></div>
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="cr-card p-4">
                <h1 class="mb-1" style="font-size:1.5rem;font-weight:800;"><i class="bi bi-bag-check me-2" style="color:var(--cr-info);"></i>Return Movie</h1>
                <p class="text-muted mb-4">Confirm you are returning this rental.</p>
                <form th:action="@{/rentals/return/{id}(id=${rental.id})}" method="post">
                    <div class="cr-card p-3 mb-4">
                        <div class="d-flex justify-content-between mb-2"><span class="text-muted">Rental ID</span><strong th:text="${rental.id}">1</strong></div>
                        <div class="d-flex justify-content-between mb-2"><span class="text-muted">Rented On</span><span th:text="${rental.rentalDate}">Date</span></div>
                        <div class="d-flex justify-content-between"><span class="text-muted">Due Date</span><strong th:text="${rental.dueDate}">Due</strong></div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-cr-primary px-4"><i class="bi bi-arrow-return-left me-1"></i>Confirm Return</button>
                        <a class="btn btn-cr-outline" href="/rentals/my-rentals">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<div th:replace="fragments :: footer"></div>
<div th:replace="fragments :: scripts"></div>
</body>
</html>
